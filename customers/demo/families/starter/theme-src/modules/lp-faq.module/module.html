<section aria-label="FAQ" style="background:#F0F4F6;padding:clamp(40px,6vw,72px) 24px">
<div style="max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
{% if module.heading %}<h2 style="margin:0;font-size:clamp(24px,3vw,36px);color:#14212B">{{ module.heading }}</h2>{% endif %}
<div>
{% for item in module.items %}
<details style="background:#fff;border:1px solid #E4E7EA;border-radius:10px;margin-bottom:12px;overflow:hidden">
<summary style="cursor:pointer;padding:18px 22px;font-weight:600;font-size:17px;color:#14212B">{{ item.question }}</summary>
<div style="padding:0 22px 20px;font-size:16px;line-height:1.6;color:#44545F">{{ item.answer }}</div>
</details>
{% endfor %}
</div>
</div>
</section>
